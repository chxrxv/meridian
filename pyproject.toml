[project]
name = "meridian"
version = "0.1.0"
description = "Meridian: a Gemini Enterprise agent suite for a fictional logistics company (portfolio project)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "chromadb>=0.5",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
adk = ["google-adk>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
packages = ["agents", "rag", "connectors", "mcp_server", "tools", "api", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scripts/generate_data.py" = ["E501"]  # long synthetic-document prose
